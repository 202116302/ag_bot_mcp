[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agri-dss"
version = "0.1.0"
description = "Traceable agricultural decision research prototype"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "requests>=2.31,<3"]

[project.optional-dependencies]
dev = ["pytest>=7.4,<10", "pypdf>=5,<8"]
mcp = ["mcp>=1.27,<2"]

[project.scripts]
agri-dss = "agri_dss.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
