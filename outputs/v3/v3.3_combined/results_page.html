, "err": "range_answer", "decision": "판단 보류: 피해 정도 수치화 불가(침수 깊이·지속시간은 있으나 품종, 토양, 배수상태, 생육세, 잎 손상 정보 없음)", "answer": "지금은 과실 비대기이고, 이랑 위까지 물이 10cm 정도로 1.5일째 빠지지 않으면 피해가 커질 수 있습니다. 토마토는 과실 비대기에는 뿌리의 산소 부족과 수분·양분 흡수 저하가 생기기 쉬워 착과 불량, 낙화·낙과, 과실 비대 저하가 늘 수 있습니다. 특히 물이 계속 고이면 뿌리 기능이 떨어져 생육이 급격히 나빠질 수 있으니, 배수로를 열어 최대한 빨리 물을 빼고 흙을 밟아 다지지 말며, 물이 빠진 뒤에는 한동안 과습이 되지 않게 관리하세요.", "basis": "참고문서에는 과실 비대기에서 토양수분 과다가 낙과의 원인은 아니지만, 건조보다 과습보다는 양분·수분 경합과 뿌리 기능 저하로 생육이 나빠질 수 있다고 되어 있음. 또한 수일간 비가 계속 올 때 일조 부족으로 화기의 기능이 약화되어 낙화를 초래한다고 되어 있으나, 현재 피해를 몇 %로 단정할 기준은 없음.", "sources": ["NONGSARO-TOMATO"], "tools": [], "tool": null, "reference": false, "retrieved": ["JEJU-TOMATO", "NONGSARO-TOMATO", "JEJU-TOMATO", "NONGSARO-TOMATO", "NONGSARO-TOMATO"], "seconds": 4.97}, {"ok": false, "items": "1/2", "err": "missing_info_ignored", "decision": "판단 보류: 피해율", "answer": "지금 상태는 피해 가능성이 큽니다. 과실 비대기에는 토양이 너무 젖어도 문제가 되지만, 이랑 위까지 10cm가 하루 반째 고여 있으면 뿌리 호흡이 나빠지고 생육이 떨어질 수 있습니다. 바로 물길을 더 내서 물을 빼고, 이후에는 과습 상태가 계속되지 않게 해야 합니다. 2차 피해를 줄이려면 물 빠진 뒤에도 밭에 바로 들어가 작업하지 말고, 식물체가 처지거나 잎이 누렇게 변하는지 1~2일 관찰하세요. 다만 지금 문서만으로 ‘수량이 몇 % 줄어든다’처럼 피해량은 판단할 수 없습니다.", "basis": "참고 문서는 과실 비대기에는 수분이 과도해도 문제가 될 수 있지만, ‘수분 과다’가 낙과의 원인은 아니라고만 설명하며, 구체적인 피해율 기준은 제시하지 않습니다. 또한 비가 수일간 계속 오면 일조 부족으로 낙화를 초래할 수 있다고 했으나, 현재는 하루 반째 침수 수준이라 정량 피해 산정 근거가 부족합니다.", "sources": ["NONGSARO-TOMATO"], "tools": [], "tool": null, "reference": false, "retrieved": ["JEJU-TOMATO", "NONGSARO-TOMATO", "JEJU-TOMATO", "NONGSARO-TOMATO", "NONGSARO-TOMATO"], "seconds": 4.89}, {"ok": false, "items": "1/2", "err": "evasion", "decision": "판단 보류: 침수 지속 이후의 온도·뿌리 상태·배수 속도 정보 부족", "answer": "지금은 과실 비대기이고, 이랑 위에 물이 10cm 정도 1.5일간 고여 있으면 뿌리의 산소 부족이 생겨 양분·수분 이동이 떨어져 과실 비대와 착과가 나빠질 수 있습니다. 특히 비가 계속되어 일조도 줄면 낙화가 늘고, 건조보다 과도한 침수는 생육을 크게 약화시킵니다. 다만 피해 “얼마나”인지는 침수 시간, 뿌리 노출 정도, 기온, 이후 배수 속도 정보가 없어 수치로 판단할 수 없습니다. 배수가 최우선입니다. 가능한 한 이랑 사이 물길을 즉시 열어 물을 빼고, 포장 내 물고임이 계속되면 추가 작업·관수·웃거름은 멈추세요. 배수 후에는 잎 시들음, 꽃·어린과 낙과, 과실 비대 지연을 2~3일 집중 관찰하세요.", "basis": "참고 문서에 따르면 과실비대는 양분·수분이 잎, 뿌리, 줄기로부터 과실로 이동하는 과정이며, 수분과 양분의 경합이 일어난다. 또한 비가 수일간 계속될 때 일조 부족으로 낙화가 생기고, 건조보다 과다한 수분은 생육을 떨어뜨릴 수 있다. 그러나 현재 피해율을 수치로 산정할 기준값은 문서에 없다.", "sources": ["NONGSARO-TOMATO"], "tools": [], "tool": null, "reference": false, "retrieved": ["JEJU-TOMATO", "NONGSARO-TOMATO", "JEJU-TOMATO", "NONGSARO-TOMATO", "NONGSARO-TOMATO"], "seconds": 5.4}, {"ok": false, "items": "1/2", "err": "evasion", "decision": "판단 보류: 침수 지속시간에 따른 피해율 기준값 없음", "answer": "현재 상황만으로는 피해 ‘정도’를 정확히 수치화해 판단하기 어렵습니다. 다만 과실 비대기에는 과실이 양분·수분의 중심이 되어 경합이 커지므로, 침수 상태가 1일 반 이상 지속되면 생육 저하와 낙과·기형과 위험이 커집니다. 지금 바로 배수로를 추가로 파서 물을 빼고, 이랑 위에 물이 더 오래 고이지 않게 하십시오. 물이 빠진 뒤에는 한동안 토양을 과습하게 두지 말고, 줄기 밑동이 썩는지와 잎의 시듦·황화, 낙화·낙과를 확인하십시오.", "basis": "참고 문서에는 과실 비대기에는 양분·수분 경합이 커진다고 되어 있으나, 침수 수심 10cm와 36시간에 대한 피해율 기준은 제시되어 있지 않습니다. 따라서 피해 ‘얼마나’는 수치 판단이 불가합니다. 대신 과실 비대기에는 낙과·기형과 위험이 커질 수 있으므로 즉시 배수 조치가 필요합니다.", "sources": ["NONGSARO-TOMATO"], "tools": [], "tool": null, "reference": false, "retrieved": ["JEJU-TOMATO", "NONGSARO-TOMATO", "JEJU-TOMATO", "NONGSARO-TOMATO", "NONGSARO-TOMATO"], "seconds": 4.72}, {"ok": false, "items": "1/2", "err": "missing_info_ignored", "decision": "판단 보류: 피해율", "answer": "현재 자료만으로는 피해 정도를 정확히 산정하기 어렵습니다. 다만 과실 비대기에는 양분·수분 이동이 중요한데, 물이 이랑 위 10cm까지 하루 반째 고여 있으면 뿌리의 산소 부족으로 과실 비대와 착과가 나빠질 수 있습니다. 지금은 가능한 한 빨리 배수로를 열어 고인 물을 빼고, 물이 빠진 뒤에는 과습 스트레스를 줄이도록 새 물주기는 피하세요. 비가 계속 오면 낙화·낙과가 늘 수 있으니 1~2일은 특히 관찰이 필요합니다.", "basis": "참고 문서에는 과실 비대기 피해율을 수치로 산정할 기준이 없습니다. 다만 과실 비대에는 양분·수분 전류가 중요하고, 토양수분 과다보다 건조가 낙화 원인으로 제시되어 있으며 비가 수일간 계속되면 일조 부족으로 낙화가 증가한다고 되어 있습니다. 따라서 현재 상황은 ‘피해 가능성 있음’까지만 판단 가능합니다.", "sources": ["NONGSARO-TOMATO"], "tools": [], "tool": null, "reference": false, "retrieved": ["JEJU-TOMATO", "NONGSARO-TOMATO", "JEJU-TOMATO", "NONGSARO-TOMATO", "NONGSARO-TOMATO"], "seconds": 3.87}, {"ok": false, "items": "1/2", "err": "missing_info_ignored", "decision": "판단 보류: 피해량을 수치화할 근거 부족", "answer": "지금 상태는 과실 비대기에 물이 이랑 위 10cm까지 찼고 1.5일째 배수가 안 된 상황이라, 토양 과습이 계속되는 중입니다. 문서상 ‘토양수분의 과다가 낙과의 원인은 되지 않고’, 오히려 ‘건조에 의한 꽃의 <script>
const DATA = JSON.parse(document.getElementById("data").textContent);
const TYPE = { simple: "단순", boundary: "경계", complex: "복합", calculation: "계산", missing: "정보 누락" };
const DOMAIN = { climate: "환경제어", nutrient: "양액관리", fertilizer: "시비", weather: "기상대응", task: "작업관리" };
const ERR = { none: "", interpretation_error: "해석 오류", missing_info_ignored: "누락 정보 추측", input_transfer_error: "입력값 전달 오류",
  retrieval_failure: "검색 실패", calculation_error: "계산 오류", evasion: "판정 회피", range_answer: "범위로 답함", explanation_error: "설명 오류", other: "기타" };
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const $ = id => document.getElementById(id);
const pct = v => (Number(v) * 100).toFixed(1) + "%";

$("run").textContent = DATA.run + " · 시나리오 " + DATA.scenarios.length + "개 × 10회";

let domain = "all";
const segs = $("domains");
[["all", "전체"], ...Object.entries(DOMAIN)].forEach(([k, label], i) => {
  const b = el("button", null, label); b.type = "button"; b.dataset.d = k; b.setAttribute("aria-pressed", String(i === 0));
  b.addEventListener("click", () => { domain = k; segs.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); filter(); });
  segs.append(b);
});

function column(s, cond) {
  const col = el("section", "col " + cond);
  const head = el("div", "col-head"); head.append(el("h3", null, cond.toUpperCase()));
  const dots = el("div", "dots"); dots.setAttribute("role", "group"); dots.setAttribute("aria-label", cond.toUpperCase() + " 회차");
  head.append(dots); col.append(head);
  const body = el("div"); body.style.display = "grid"; body.style.gap = "8px"; col.append(body);
  const runs = s.runs[cond];
  const majorityOk = s.score[cond] >= 5;
  let pick = runs.findIndex(r => r.ok === majorityOk); if (pick < 0) pick = 0;
  runs.forEach((r, i) => {
    const b = el("button", null, String(i + 1)); b.type = "button";
    b.setAttribute("aria-label", (i + 1) + "회차");
    b.addEventListener("click", () => show(i)); dots.append(b);
  });
  function show(i) {
    pick = i; const r = runs[i];
    dots.querySelectorAll("button").forEach((b, j) => b.setAttribute("aria-pressed", String(j === i)));
    body.textContent = "";
    const dec = el("div", "dec"); dec.append(el("span", null, r.decision || "(판정 없음)"));
    body.append(dec, el("div", "ans", r.answer));
    const meta = el("div", "meta");
    meta.append(el("span", null, (i + 1) + "회차"));
    if (cond === "mcp" && r.reference) meta.append(el("span", "ref", "다른 농가 참고 사용"));
    meta.append(el("span", null, r.seconds + "초"));
    body.append(meta);
    const d = el("details"); d.append(el("summary", null, cond === "mcp" ? "도구 호출과 근거" : "검색 문서와 근거"));
    let t = "";
    if (cond === "mcp") {
      t = "호출 순서: " + (r.tools.join(" → ") || "없음");
      t += r.tool ? "\n판정 도구: " + r.tool.name + "\n넘긴 값: " + JSON.stringify(r.tool.args) + "\n도구 판정: " + r.tool.result : "\n판정 도구를 호출하지 않음";
    } else {
      const cnt = {}; r.retrieved.forEach(x => cnt[x] = (cnt[x] || 0) + 1);
      t = "검색된 문단 5개의 출처: " + Object.entries(cnt).map(([k, v]) => k + " " + v).join(", ");
    }
    if (r.basis) t += "\n\n근거: " + r.basis;
    t += "\n출처 표기: " + (r.sources.join(", ") || "없음");
    d.append(el("pre", null, t)); body.append(d);
  }
  show(pick);
  return col;
}

const cards = DATA.scenarios.map(s => {
  const c = el("article", "card"); c.dataset.d = s.domain; c.dataset.gap = Math.abs(s.score.mcp - s.score.rag);
  const h = el("div", "head");
  h.append(el("span", "chip mono", s.sid), el("span", "chip", DOMAIN[s.domain]), el("span", "chip", TYPE[s.type]));
  const cmp = el("div", "cmp"); cmp.append(column(s, "rag"), column(s, "mcp"));
  c.append(h, el("div", "q", s.question), cmp);
  $("list").append(c);
  return c;
});
const empty = el("p", "empty", "조건에 맞는 문항이 없습니다."); empty.hidden = true; $("list").append(empty);

function filter() {
  let n = 0;
  cards.forEach(c => { const v = domain === "all" || c.dataset.d === domain; c.hidden = !v; if (v) n++; });
  empty.hidden = n > 0;
}
filter();
</script>
