# 판정 규칙표 (mcp_agri_dss_spec.md 6절)
# - 각 규칙은 doc_id와 원문 clause를 가진다. clause는 knowledge/chunks.jsonl 안에 실제로 있어야 한다(테스트로 확인).
# - 경계 처리: 문서의 "이상/이하"는 포함(>=, <=). 문서 표현이 겹치는 경우는 boundary에 결정을 적는다.
# - 단위는 출처 표기를 그대로 쓴다.

climate:
  ENV-01: {doc_id: JEJU-TOMATO, page: 2, clause: "30℃이상의 높은 온도에서는 광합성에 의한 생산보다 호흡에 의한 소비가 많아져서 생육이 나빠지고 꽃이 잘 떨어진다",
           day_max: 30, unit: "℃", action: "환기·차광"}
  ENV-02: {doc_id: JEJU-TOMATO, page: 2, clause: "생육에 가장 적당한 온도는 낮 온도가 25∼27℃이고 밤 온도는 17℃정도",
           day_optimal: [25, 27], night_optimal: 17, unit: "℃"}
  ENV-03: {doc_id: JEJU-TOMATO, page: 1, clause: "밤온도가 20℃이상이면 공동과, 낙화가 많아지고 품질도 나빠진다",
           night_max: 20, unit: "℃", action: "야간 환기"}
  ENV-04: {doc_id: JEJU-TOMATO, page: 2, clause: "10℃이하일 때는 생육이 떨어진다",
           min_growth: 10, unit: "℃", action: "난방·보온"}
  ENV-05: {doc_id: JEJU-TOMATO, page: 2, clause: "5℃이하에서는 생육이 정지되고",
           growth_stop: 5, unit: "℃", action: "즉시 난방"}
  ENV-06: {doc_id: JEJU-TOMATO, page: 25, clause: "70% 이상시 발생이 우려되며",
           rh_max: 70, rh_target: 50, unit: "%", action: "송풍·환기",
           note: "열과 대책: 송풍으로 공중습도 저하 (50%이하)"}
  ENV-07: {doc_id: RDA-WEATHER-2025, page: 45, clause: "온실 내부온도를 차광하지 않은 경우보다 최대 4℃ 낮출 수 있음",
           shading_effect: 4, fog_effect: [4, 5], unit: "℃", explain_only: true}
  ENV-08: {doc_id: JEJU-TOMATO, page: 4, clause: "외기온이 10℃이하로 떨어지면 야간환기를 멈춘다",
           outdoor_min_for_night_vent: 10, unit: "℃",
           priority: "야간 고습(ENV-06)과 저온 외기(ENV-08)가 겹치면 환기 대신 송풍으로 습도를 낮춘다"}

